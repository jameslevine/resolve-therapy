name: Deploy Dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Dev
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies
        run: npm ci && cd lambda && npm ci

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --region eu-west-2 \
            --stack-name resolve-therapy-dev \
            --template-file infrastructure/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              FrontendBucketName=resolve-therapy-dev-frontend \
              TableName=resolve-therapy-dev \
              ElevenLabsApiKey="${{ secrets.ELEVENLABS_API_KEY }}" \
              StripeSecretKey="${{ secrets.STRIPE_SECRET_KEY }}" \
              SessionPriceCents="${{ vars.SESSION_PRICE_CENTS }}" \
              BedrockModelId="${{ vars.BEDROCK_MODEL_ID }}" \
              TranscribeBucket=resolve-therapy-dev-frontend \
              Environment=dev \
            --no-fail-on-empty-changeset

      - name: Get stack outputs
        id: stack
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --region eu-west-2 \
            --stack-name resolve-therapy-dev \
            --query "Stacks[0].Outputs" \
            --output json)
          echo "api_url=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="ApiUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "bucket=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="DistributionId") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "cf_url=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="CloudFrontUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "user_pool_client_id=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="UserPoolClientId") | .OutputValue')" >> "$GITHUB_OUTPUT"

      - name: Update Lambda FRONTEND_URL
        run: |
          CF_URL="https://${{ steps.stack.outputs.cf_url }}"
          for FUNC in resolve-therapy-dev-checkout resolve-therapy-dev-sessions resolve-therapy-dev-voice; do
            CURRENT=$(aws lambda get-function-configuration \
              --region eu-west-2 \
              --function-name "$FUNC" \
              --query "Environment.Variables" --output json 2>/dev/null || echo "{}")
            UPDATED=$(echo "$CURRENT" | jq --arg url "$CF_URL" '. + {FRONTEND_URL: $url} | {Variables: .}')
            aws lambda update-function-configuration \
              --region eu-west-2 \
              --function-name "$FUNC" \
              --environment "$UPDATED" \
              --no-cli-pager > /dev/null || true
          done

      - name: Build & deploy Lambda
        run: |
          cd lambda && npm run build
          cd dist && zip -r /tmp/lambda.zip . > /dev/null && cd ..
          zip -r /tmp/lambda.zip node_modules -x "node_modules/.package-lock.json" > /dev/null
          cd ..
          for FUNC in resolve-therapy-dev-checkout resolve-therapy-dev-sessions resolve-therapy-dev-voice; do
            aws lambda update-function-code \
              --region eu-west-2 \
              --function-name "$FUNC" \
              --zip-file fileb:///tmp/lambda.zip \
              --no-cli-pager > /dev/null
          done

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ steps.stack.outputs.api_url }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.stack.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.stack.outputs.user_pool_client_id }}

      - name: Deploy frontend to S3
        run: |
          aws s3 sync dist/ "s3://${{ steps.stack.outputs.bucket }}/" \
            --region eu-west-2 --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" --exclude "*.json"
          aws s3 cp dist/index.html "s3://${{ steps.stack.outputs.bucket }}/index.html" \
            --region eu-west-2 \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution_id }}" \
            --paths "/*" --no-cli-pager > /dev/null

      - name: Summary
        run: |
          echo "### Dev Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://${{ steps.stack.outputs.cf_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: ${{ steps.stack.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
